[package]
name = "wifi_gui"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bitflags = "2.10.0"
crossterm = {version = "0.29.0", features = ["event-stream"]}
futures-util = "0.3.31"
ratatui = "0.29.0"
tokio = {version = "1.48.0", features = ["full"] }
uuid = {version = "1.20.0", features = ["v4", "v5"]}
zbus = {version = "5.12.0", default-features = false, features = ["tokio"]}
